syntax = "proto3";

// Definition of the `Arguebuf` format for storing structured argument graphs.
package arg_services.graph.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Main message to store the argument graph.
// Each attribute having of type `map<string, X>` is a dictionary where a unique ID points to a message.
// The ID does not follow a specific format, but we reccomend to use UUIDv1 everywhere.
// An alternative could be to use a counter for each attribute, but this is error prone and not recommended.
// The ID should be treated the same way as a primary key in a database and may be referenced in other places of the argument.
// For instance, edges only store the IDs of connected nodes.
message Graph {
  // Dictionary of atom/scheme nodes.
  map<string, Node> nodes = 1;
  // Dictionary of edges connecting nodes.
  map<string, Edge> edges = 2;
  // Dictionary of resources (i.e., source texts) of the argument such as newspaper articles.
  map<string, Resource> resources = 3;
  // Dictionary of participants (i.e., persons, users) that created the original argument.
  map<string, Participant> participants = 4;
  // Dictionary of analysts/annotators that created the graph-based representation of the original argument.
  map<string, Analyst> analysts = 5;
  // ID of the atom node being the major claim of the graph.
  optional string major_claim = 6;
  // Version of the protobuf schema. Should be always `1`.
  uint32 schema_version = 7;
  // Library used for serializing the graph.
  // Should be unique accross programming languages (e.g., `arguebuf-python:1.2.0`).
  string library_version = 8;
  // Store programmatic data like creation times.
  Metadata metadata = 14;
  // Store arbitrary data as needed by a user.
  // May contain all valid JSON values.
  google.protobuf.Struct userdata = 15;
}

// Store metadata like created/update timestamps.
// It is used as an attribute type by most other messages.
// These attribute should NOT be modified by users directly!
message Metadata {
  // Creation time of the element.
  google.protobuf.Timestamp created = 1;
  // Update time of the element
  google.protobuf.Timestamp updated = 2;
}

// A resource is the original source of an argument.
// Examples include newspaper articles, protocols, and essays.
// These may be linked to atom nodes via their `reference` attribute.
message Resource {
  // Plain-text content of the original argument.
  string text = 1;
  // Title (if available) of the source.
  optional string title = 2;
  // URL or other unique attribute to find/identify the resource
  optional string source = 3;
  // Creation time of the resource.
  google.protobuf.Timestamp timestamp = 4;
  // Store programmatic data like creation times.
  Metadata metadata = 14;
  // Store arbitrary data as needed by a user.
  // May contain all valid JSON values.
  google.protobuf.Struct userdata = 15;
}

// A participant is a person/user that contributed to the original argument (e.g., an expert providing a statement).
message Participant {
  // Full name.
  string name = 1;
  // Optional: username.
  optional string username = 2;
  // Optional: email address.
  optional string email = 3;
  // Optional: link to relevant website.
  optional string url = 4;
  // Optional: relevant place.
  optional string location = 5;
  // Optional: description (e.g., role of a person).
  optional string description = 6;
  // Store programmatic data like creation times.
  Metadata metadata = 14;
  // Store arbitrary data as needed by a user.
  // May contain all valid JSON values.
  google.protobuf.Struct userdata = 15;
}

// Analysts are the persons that transform the textual argument to an argument graph.
// They are also known as annotators.
message Analyst {
  // Full name.
  string name = 1;
  // Optional: email address.
  optional string email = 2;
  // Store programmatic data like creation times.
  Metadata metadata = 14;
  // Store arbitrary data as needed by a user.
  // May contain all valid JSON values.
  google.protobuf.Struct userdata = 15;
}

// An edge serves as a connection between two nodes.
message Edge {
  // ID of the source node.
  string source = 1;
  // ID of the target node.
  string target = 2;
  // Store programmatic data like creation times.
  Metadata metadata = 14;
  // Store arbitrary data as needed by a user.
  // May contain all valid JSON values.
  google.protobuf.Struct userdata = 15;
}

// A node contains the semantic information of the argument.
message Node {
  // Nodes may either be atoms or schemes.
  // A description of each type may be found in the respective messages.
  oneof type {
    Atom atom = 1;
    Scheme scheme = 2;
  }
  // Store programmatic data like creation times.
  Metadata metadata = 14;
  // Store arbitrary data as needed by a user.
  // May contain all valid JSON values.
  google.protobuf.Struct userdata = 15;
}

// Atom nodes contain textual information and as such parts of the original resource.
// Atoms are also known as `ADUs` or claims/premises in the argumentation domain.
message Atom {
  // Textual content of the argumentative discourse unit (ADU).
  string text = 1;
  // Optional: Reference to the related resource.
  Reference reference = 2;
  // Optional: ID of the related participant.
  optional string participant = 3;
}

// References are used to store links between atom nodes and resources.
message Reference {
  // Optional: ID of the related resouce.
  optional string resource = 1;
  // Optional: Starting point of the atom's text within the resource's text.
  optional uint32 offset = 2;
  // Original text of the related resource used for the atom.
  string text = 3;
}

// Scheme nodes encode the relations between other nodes.
message Scheme {
  // A scheme has to be of a specific type. If not set, the inference between atoms is unknown.
  oneof type {
    Support support = 1;
    Attack attack = 2;
    Preference preference = 3;
    Rephrase rephrase = 4;
  }
  // List of atom ID's to assign the connected premises to their role in the argumentation scheme.
  // Please note: The order of the ID's is important here and should correspond the one found in the underlying literature used for a specific project.
  repeated string premise_descriptors = 15;
}

// Argumentation schemes for type support.
// Source: Walton, Douglas, Christopher Reed, and Fabrizio Macagno. 2008. Argumentation Schemes. Cambridge University Press.
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
enum Support {
  SUPPORT_DEFAULT = 0 [(label) = "Default"];
  SUPPORT_POSITION_TO_KNOW = 1 [(label) = "Position to Know"];
  SUPPORT_EXPERT_OPINION = 2 [(label) = "Expert Opinion"];
  SUPPORT_WITNESS_TESTIMONY = 3 [(label) = "Witness Testimony"];
  SUPPORT_POPULAR_OPINION = 4 [(label) = "Popular Opinion"];
  SUPPORT_POPULAR_PRACTICE = 5 [(label) = "Popular Practice"];
  SUPPORT_EXAMPLE = 6 [(label) = "Example"];
  SUPPORT_ANALOGY = 7 [(label) = "Analogy"];
  SUPPORT_PRACTICAL_REASONING_FROM_ANALOGY = 8 [(label) = "Practical Reasoning from Analogy"];
  SUPPORT_COMPOSITION = 9 [(label) = "Composition"];
  SUPPORT_DIVISION = 10 [(label) = "Division"];
  SUPPORT_OPPOSITIONS = 11 [(label) = "Oppositions"];
  SUPPORT_RHETORICAL_OPPOSITIONS = 12 [(label) = "Rhetorical Oppositions"];
  SUPPORT_ALTERNATIVES = 13 [(label) = "Alternatives"];
  SUPPORT_VERBAL_CLASSIFICATION = 14 [(label) = "Verbal Classification"];
  SUPPORT_VERBAL_CLASSIFICATION_DEFINITION = 15 [(label) = "Definition to Verbal Classification"];
  SUPPORT_VERBAL_CLASSIFICATION_VAGUENESS = 16 [(label) = "Vagueness of a Verbal Classification"];
  SUPPORT_VERBAL_CLASSIFICATION_ARBITRARINESS = 17 [(label) = "Arbitrariness of a Verbal Classification"];
  SUPPORT_INTERACTION_OF_ACT_AND_PERSON = 18 [(label) = "Interaction of Act and Person"];
  SUPPORT_VALUES = 19 [(label) = "Values"];
  SUPPORT_POSITIVE_VALUES = 61 [(label) = "Positive Values"];
  SUPPORT_NEGATIVE_VALUES = 62 [(label) = "Negative Values"];
  SUPPORT_SACRIFICE = 20 [(label) = "Sacrifice"];
  SUPPORT_THE_GROUP_AND_ITS_MEMBERS = 21 [(label) = "The Group and its Members"];
  SUPPORT_PRACTICAL_REASONING = 22 [(label) = "Practical Reasoning"];
  SUPPORT_TWO_PERSON_PRACTICAL_REASONING = 23 [(label) = "Two-Person Practical Reasoning"];
  SUPPORT_WASTE = 24 [(label) = "Waste"];
  SUPPORT_SUNK_COSTS = 25 [(label) = "Sunk Costs"];
  SUPPORT_IGNORANCE = 26 [(label) = "Ignorance"];
  SUPPORT_EPISTEMIC_IGNORANCE = 27 [(label) = "Epistemic Ignorance"];
  SUPPORT_CAUSE_TO_EFFECT = 28 [(label) = "Cause to Effect"];
  SUPPORT_CORRELATION_TO_CAUSE = 29 [(label) = "Correlation to Cause"];
  SUPPORT_SIGN = 30 [(label) = "Sign"];
  SUPPORT_ABDUCTIVE = 31 [(label) = "Abductive"];
  SUPPORT_EVIDENCE_TO_HYPOTHESIS = 32 [(label) = "Evidence to Hypothesis"];
  SUPPORT_CONSEQUENCES = 33 [(label) = "Consequences"];
  SUPPORT_POSITIVE_CONSEQUENCES = 63 [(label) = "Positive Consequences"];
  SUPPORT_NEGATIVE_CONSEQUENCES = 64 [(label) = "Negative Consequences"];
  SUPPORT_PRAGMATIC_ALTERNATIVES = 34 [(label) = "Pragmatic Alternatives"];
  SUPPORT_THREAT = 35 [(label) = "Threat"];
  SUPPORT_FEAR_APPEAL = 36 [(label) = "Fear Appeal"];
  SUPPORT_DANGER_APPEAL = 37 [(label) = "Danger Appeal"];
  SUPPORT_NEED_FOR_HELP = 38 [(label) = "Need for Help"];
  SUPPORT_DISTRESS = 39 [(label) = "Distress"];
  SUPPORT_COMMITMENT = 40 [(label) = "Commitment"];
  SUPPORT_ETHOTIC = 41 [(label) = "Ethotic"];
  SUPPORT_GENERIC_AD_HOMINEM = 42 [(label) = "Generic ad Hominem"];
  SUPPORT_PRAGMATIC_INCONSISTENCY = 43 [(label) = "Pragmatic Inconsistency"];
  SUPPORT_INCONSISTENT_COMMITMENT = 44 [(label) = "Inconsistent Commitment"];
  SUPPORT_CIRCUMSTANTIAL_AD_HOMINEM = 45 [(label) = "Circumstantial Ad Hominem"];
  SUPPORT_BIAS = 46 [(label) = "Bias"];
  SUPPORT_BIAS_AD_HOMINEM = 47 [(label) = "Bias Ad Hominem"];
  SUPPORT_GRADUALISM = 48 [(label) = "Gradualism"];
  SUPPORT_SLIPPERY_SLOPE = 49 [(label) = "Slippery Slope"];
  SUPPORT_PRECEDENT_SLIPPERY_SLOPE = 50 [(label) = "Precedent Slippery Slope"];
  SUPPORT_SORITES_SLIPPERY_SLOPE = 51 [(label) = "Sorites Slippery Slope"];
  SUPPORT_VERBAL_SLIPPERY_SLOPE = 52 [(label) = "Verbal Slippery Slope"];
  SUPPORT_FULL_SLIPPERY_SLOPE = 53 [(label) = "Full Slippery Slope"];
  SUPPORT_CONSTITUTIVE_RULE_CLAIMS = 54 [(label) = "Constitutive Rule Claims"];
  SUPPORT_RULES = 55 [(label) = "Rules"];
  SUPPORT_EXCEPTIONAL_CASE = 56 [(label) = "Exceptional Case"];
  SUPPORT_PRECEDENT = 57 [(label) = "Precedent"];
  SUPPORT_PLEA_FOR_EXCUSE = 58 [(label) = "Plea for Excuse"];
  SUPPORT_PERCEPTION = 59 [(label) = "Perception"];
  SUPPORT_MEMORY = 60 [(label) = "Memory"];
}

// Argumentation schemes for type attack.
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
enum Attack {
  ATTACK_DEFAULT = 0 [(label) = "Default"];
}

// Argumentation schemes for type preference.
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
enum Preference {
  PREFERENCE_DEFAULT = 0 [(label) = "Default"];
}

// Argumentation schemes for type rephrase.
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
enum Rephrase {
  REPHRASE_DEFAULT = 0 [(label) = "Default"];
}

// Options of enum values.
extend google.protobuf.EnumValueOptions {
  // Human-readable label of the enum value, e.g. `Expert Opinion` for `SUPPORT_EXPERT_OPINION`.
  string label = 51000;
}
